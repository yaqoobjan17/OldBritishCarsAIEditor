name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Restore Android project from ZIP
        run: |
          rm -rf app src build.gradle settings.gradle gradle.properties
          mkdir -p _project
          unzip -q OldBritishCarsAndroidV2_APKReady.zip -d _project
          ROOT=$(find _project -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -R "$ROOT"/. .
          test -f settings.gradle
          test -d app

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OldBritishCars-AI-Editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
