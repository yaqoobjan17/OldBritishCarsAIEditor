name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - - name: Install Android SDK
  run: |
    yes | sdkmanager --licenses > /dev/null || true
    sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Android project from ZIP
        run: |
          rm -rf app src build.gradle settings.gradle gradle.properties
          mkdir -p _project
          unzip -q OldBritishCarsAndroidV2_APKReady.zip -d _project
          ROOT=$(find _project -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -R "$ROOT"/. .
          test -f settings.gradle
          test -d app

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OldBritishCars-AI-Editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
